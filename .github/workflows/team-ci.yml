name: Team verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: team-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check handoff and tooling
        run: |
          npm run team:check
          npm run team:test
          node --test scripts/prepare-team-share.test.mjs
          npm run team:doctor
      - name: Verify isolated application and data persistence
        run: npm run team:verify
      - name: Save synthetic verification results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: team-verification
          if-no-files-found: ignore
          retention-days: 7
          path: |
            runtime/evidence/team-collaboration-20261017/verify/*/api-results.json
            runtime/evidence/team-collaboration-20261017/verify/*/server-browser-results.json
            runtime/evidence/team-collaboration-20261017/verify/*/persistence-result.json
      - name: Stop without deleting volumes
        if: always()
        run: npm run team:down
